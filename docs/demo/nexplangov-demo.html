:root {
  color-scheme: light;
  --font-sans: 'Plus Jakarta Sans Variable', 'Segoe UI', system-ui, sans-serif;
  --color-marinho: #1E5470; --color-azul: #34729C; --color-celeste: #6CB1DA; --color-turquesa: #6EC1D1; --color-gelo: #D1ECFF; --color-agua: #CBEAEC;
  --color-tinta: #0F2A3A; --color-texto2: #4A6273; --color-linha: #E1EBF2; --color-fundo: #F3F7FA;
  --color-sucesso: #1F8A70; --color-alerta: #C2410C; --color-perigo: #B42318;
  --ease-suave: cubic-bezier(.2, .8, .2, 1); --dur-rapida: 140ms; --dur-media: 240ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { margin: 0; }

    body { background: var(--color-fundo); color: var(--color-tinta); -webkit-font-smoothing: antialiased; }
    a { color: var(--color-azul); }
    a:hover { color: var(--color-marinho); }
    :focus-visible { outline: 3px solid var(--color-celeste); outline-offset: 2px; }

    .app { display: flex; min-height: 100vh; }
    .side { width: 264px; flex: none; background: var(--color-marinho); color: var(--color-gelo); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--color-turquesa); color: var(--color-marinho); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex: none; }
    .brand b { display: block; color: #fff; font-size: 16px; letter-spacing: -.01em; }
    .brand small { display: block; color: #A9D2EE; font-size: 12px; margin-top: 2px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8EC3E3; padding: 12px 12px 6px; font-weight: 600; }
    .nav a, .nav span.soon { white-space: nowrap; display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 44px; border-radius: 10px; color: var(--color-gelo); text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav a.on { background: var(--color-azul); color: #fff; font-weight: 600; }
    .nav span.soon { color: #A9D2EE; cursor: default; }
    .nav span.soon em { margin-left: auto; font-style: normal; font-size: 10.5px; background: rgba(255,255,255,.1); padding: 2px 8px; border-radius: 99px; }
    .side .foot { margin-top: auto; padding: 14px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 12px; color: #CDE7F7; line-height: 1.5; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 32px; background: #fff; border-bottom: 1px solid var(--color-linha); }
    .org { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--color-texto2); }
    .org b { color: var(--color-tinta); font-size: 14px; }
    .me { display: flex; align-items: center; gap: 12px; }
    .me .who { text-align: right; font-size: 13px; line-height: 1.3; }
    .me .who b { display: block; font-size: 14px; }
    .me .who span { color: var(--color-texto2); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--color-gelo); color: var(--color-marinho); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
    .icobtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5E3EC; background: #fff; color: var(--color-marinho); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .icobtn:hover { background: #F0F7FC; }

    .content { padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; width: 100%; }
    .h1 { font-size: 28px; font-weight: 800; letter-spacing: -.025em; margin: 0; }
    .sub { color: var(--color-texto2); font-size: 14px; margin: 6px 0 0; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn-p { background: var(--color-azul); color: #fff; }
    .btn-p:hover { background: var(--color-marinho); color: #fff; }

    /* ===== Design system NexPlanGov: camada premium ===== */

    .card { transition: box-shadow var(--dur-media) var(--ease-suave), transform var(--dur-media) var(--ease-suave), border-color var(--dur-media) var(--ease-suave); }
    a.card:hover, .card-link:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(30,84,112,.06), 0 18px 34px -18px rgba(30,84,112,.32); border-color: #C9DCE8; }
    .input, select.input, textarea.input { transition: border-color var(--dur-rapida) var(--ease-suave), box-shadow var(--dur-media) var(--ease-suave); }

    .etapas { display: flex; gap: 0; overflow-x: auto; padding: 4px 0; }

    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }

    @media (max-width: 960px) {

        .auth-hero { padding: 32px 24px; }
        .auth-hero h1 { font-size: 30px; }

    }

        .nav a.on { background: var(--color-azul); }

.sucesso-pub svg { color: #155E6B; background: var(--color-agua); border-radius: 50%; padding: 12px; width: 56px; height: 56px; }
.protocolo { font-size: 20px; letter-spacing: .04em; color: var(--color-marinho); }
/* Modal */
#modal[hidden] { display: none; }
#modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-fundo { position: absolute; inset: 0; background: rgba(15,42,58,.45); backdrop-filter: blur(3px); animation: aparecer var(--dur-media) var(--ease-suave); }
.modal-caixa { position: relative; background: #fff; border-radius: 20px; width: 100%; max-width: 620px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 30px 80px -20px rgba(15,42,58,.5); animation: subir 280ms var(--ease-suave); }
.modal-caixa.largo { max-width: 860px; }
.modal-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--color-linha); }
.modal-topo h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.modal-corpo { padding: 20px 22px 22px; overflow-y: auto; }
body.com-modal { overflow: hidden; }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
/* Toasts */
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 10px; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; background: #0F2A3A; color: #fff; font-size: 14px; box-shadow: 0 16px 40px -16px rgba(15,42,58,.6); animation: subir 280ms var(--ease-suave); transition: opacity 400ms, transform 400ms var(--ease-suave); }
.toast svg { flex: none; color: var(--color-turquesa); margin-top: 1px; }
.toast-erro { background: #7F1414; } .toast-erro svg { color: #FECACA; }
.toast.sai { opacity: 0; transform: translateY(8px); }
@media (max-width: 860px) { .troca select { max-width: 180px; } .brand svg { width: 160px; } .pub-top { padding: 14px 16px; } .trans { flex-direction: column; align-items: flex-start; } }
a.card, a.card:hover { text-decoration: none; color: inherit; }
code.hash { white-space: nowrap; }
.tbl td code.hash { display: inline-block; }

</style>
</head>

/* ---------------- regras da Lei 14.133 ---------------- */
function mediana(v) { const a = [...v].sort((x, y) => x - y); const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
function cv(v) { if (v.length < 2) return 0; const m = v.reduce((s, x) => s + x, 0) / v.length; const dp = Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1)); return m ? dp / m * 100 : 0; }

/** Pesquisa de preços (art. 23): validade, destoantes (50% da mediana), método e mínimo de 3 preços. */
function pesquisa(item, ref = hoje()) {
    const descartadas = {}, cand = {}, alertas = [];
    item.cotacoes.forEach((c, i) => {
        const v = Number(c.valor), f = FONTES[c.fonte];
        if (v <= 0) { descartadas[i] = 'Valor zerado ou negativo.'; return; }
        if (c.data > ref) { descartadas[i] = 'Data posterior à data da pesquisa.'; return; }
        if (f.val && c.data < somaMeses(-f.val, ref)) { descartadas[i] = `Fora da validade: ${f.rot.toLowerCase()} aceita no máximo ${f.val} meses.`; return; }
        cand[i] = v;
    });
    if (Object.keys(cand).length >= 3) {
        const md = mediana(Object.values(cand));
        for (const i of Object.keys(cand)) {
            if (cand[i] > md * 1.5) { descartadas[i] = 'Excessivamente elevada: mais de 50% acima da mediana.'; delete cand[i]; }
            else if (cand[i] < md * 0.5) { descartadas[i] = 'Possivelmente inexequível: mais de 50% abaixo da mediana.'; delete cand[i]; }
        }
    }
    const vals = Object.values(cand);
    if (vals.length < 3) alertas.push('Menos de 3 preços válidos. Junte mais cotações ou justifique no processo (art. 23, § 1º).');
    const forn = Object.keys(cand).filter(i => item.cotacoes[i].fonte === 'fornecedor');
    if (forn.length && forn.length < 3 && forn.length === vals.length) alertas.push('Pesquisa direta com fornecedores exige no mínimo 3 orçamentos (art. 23, § 1º, IV).');
    const metodo = item.metodo || 'mediana';
    const valor = !vals.length ? 0 : metodo === 'media' ? vals.reduce((s, x) => s + x, 0) / vals.length : metodo === 'menor' ? Math.min(...vals) : mediana(vals);
    return { valor: Math.round(valor * 100) / 100, validas: Object.keys(cand).map(Number), descartadas, alertas, cv: cv(vals), metodo };
}
const valorItem = it => it.qtd * pesquisa(it).valor;
const valorProcesso = p => p.itens.reduce((s, it) => s + valorItem(it), 0);

/** Limites de dispensa por valor (art. 75, I e II), atualizados por decreto (art. 182), em dobro no § 2º. */
function limiteDispensa(ano, categoria) {
    const anos = Object.keys(S.limites).map(Number).sort();
    const l = S.limites[ano] || S.limites[anos[anos.length - 1]];
    const v = (ehEngenharia(categoria) ? l.eng : l.outros) * (S.orgao.dobro ? 2 : 1);
    return { valor: v, base: l.base, conferido: l.conferido, inciso: ehEngenharia(categoria) ? 'I' : 'II' };
}
/** Soma do exercício por natureza de despesa (art. 75, § 1º): evita o fracionamento. */
function consumoDispensa(ano, natureza, excetoId) {
    return S.processos.filter(p => p.modalidade === 8 && [18, 19].includes(p.amparo) && p.ano === ano && p.natureza === natureza && p.id !== excetoId && !['revogado', 'anulado', 'deserto', 'fracassado'].includes(p.situacao));
}
function avaliarDispensa(ano, categoria, natureza, valorNovo, excetoId) {
    const lim = limiteDispensa(ano, categoria);
    const outros = consumoDispensa(ano, natureza, excetoId);
    const usado = outros.reduce((s, p) => s + valorProcesso(p), 0);
    const total = usado + Number(valorNovo || 0);
    return { lim, outros, usado, total, saldo: lim.valor - usado, ok: total <= lim.valor + 0.001, pct: lim.valor ? total / lim.valor * 100 : 0 };
}

/** Checklist da instrução (art. 18, art. 53 e art. 72). */
function checklist(p) {
    const ok = t => p.docs[t] && p.docs[t].situacao === 'concluido';
    const d = (t, etapa = 'instrucao') => ({ chave: t, rot: DOCS[t].rot, base: DOCS[t].base, ok: ok(t), etapa });
    const L = [d('dfd')];
    if (ehDireta(p.modalidade)) L.push(d('termo_referencia')); else L.push(d('etp'), d('mapa_riscos'), d('termo_referencia'));
    const semPreco = p.itens.filter(it => pesquisa(it).valor <= 0).length;
    L.push({ chave: 'pesquisa_precos', rot: 'Pesquisa de preços e valor estimado', base: ehDireta(p.modalidade) ? 'Art. 72, II, e art. 23' : 'Art. 18, IV, e art. 23', ok: p.itens.length > 0 && semPreco === 0, etapa: 'instrucao', detalhe: !p.itens.length ? 'Cadastre os itens.' : semPreco ? `${semPreco} item(ns) sem preço estimado.` : null });
    L.push(d('dotacao'));
    if (ehDireta(p.modalidade)) L.push(d('habilitacao'), d('razao_escolha'), d('justificativa_preco')); else L.push(d('minuta_edital'), d('minuta_contrato'));
    if (ehPresencial(p.modalidade)) L.push(d('justificativa_presencial'));
    L.push(d('parecer_juridico', 'juridico'), d('autorizacao', 'autorizacao'));

}

        aguardando_autorizacao: [['publicado', 'processos.autorizar', false, dir ? 'Autorizar a contratação direta e divulgar' : 'Autorizar e publicar o edital'], ['planejamento', 'processos.autorizar', true, 'Devolver para ajustes']],
        publicado: dir ? [['homologado', 'processos.autorizar', false, 'Registrar a contratação direta']] : [['em_julgamento', 'processos.gerenciar', false, 'Abrir a sessão e o julgamento']],
        em_julgamento: [['homologado', 'processos.autorizar', false, 'Homologar o resultado'], ['deserto', 'processos.gerenciar', true, 'Declarar deserto'], ['fracassado', 'processos.gerenciar', true, 'Declarar fracassado']],
        homologado: [['contratado', 'contratos.gerenciar', false, 'Registrar o contrato']],
    }[p.situacao] || [];
    const lista = m.map(([para, perm, just, rot]) => ({ para, perm, just, rot }));
    if (!ENCERRADOS.includes(p.situacao)) {
        lista.push({ para: 'revogado', perm: 'processos.autorizar', just: true, rot: 'Revogar (interesse público, art. 71, II)', perigo: true });
        lista.push({ para: 'anulado', perm: 'processos.autorizar', just: true, rot: 'Anular (ilegalidade, art. 71, III)', perigo: true });

}
function bloqueiosTransicao(p, para) {
    const motivos = [];
    if (p.situacao === 'planejamento' && para === 'analise_juridica') {
        checklist(p).filter(i => i.etapa === 'instrucao' && !i.ok).forEach(i => motivos.push(`Pendente: ${i.rot} (${i.base}).`));
    }
    if (p.situacao === 'analise_juridica' && para === 'aguardando_autorizacao') {
        const par = p.docs.parecer_juridico;
        if (!par || par.situacao !== 'concluido') motivos.push('O parecer jurídico precisa estar concluído (art. 53).');
        else if (/^desfavor/i.test((par.campos.conclusao || '').trim())) motivos.push('Parecer desfavorável: devolva para ajustes em vez de seguir (art. 53).');
    }
    if (p.situacao === 'aguardando_autorizacao' && para === 'publicado') {
        if (!p.docs.autorizacao || p.docs.autorizacao.situacao !== 'concluido') motivos.push('A autorização da autoridade precisa estar concluída (art. 72, VIII).');
    }
    if ((para === 'publicado' || para === 'homologado') && p.modalidade === 8 && [18, 19].includes(p.amparo)) {
        const a = avaliarDispensa(p.ano, p.categoria, p.natureza, valorProcesso(p), p.id);
        if (!a.ok) motivos.push(`Limite da dispensa estourado: ${reais(a.total)} somados no exercício para a natureza ${p.natureza}, acima de ${reais(a.lim.valor)} (art. 75, ${a.lim.inciso}, e § 1º). Isso caracteriza fracionamento.`);
    }
    if (para === 'homologado' && p.fornecedorId) {
        const f = fornecedor(p.fornecedorId);
        if (f && impedido(f)) motivos.push(`${f.nome} está impedido de contratar com a Administração (art. 156, III e IV).`);
    }
    return motivos;

function toast(msg, tipo = 'ok') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`; el.setAttribute('role', 'status');
    el.innerHTML = `${ico(tipo === 'ok' ? 'ok' : 'alerta')}<span>${esc(msg)}</span>`;
    const caixa = $('#toasts'); caixa.appendChild(el);
    while (caixa.children.length > 3) caixa.firstElementChild.remove();
    setTimeout(() => el.classList.add('sai'), 3600);
    setTimeout(() => el.remove(), 4000);
}

function proximosPassos() {
    const L = [];
    S.processos.forEach(p => {
        const ds = destinos(p).filter(d => pode(d.perm) && !d.perigo);
        ds.forEach(d => {
            const b = bloqueiosTransicao(p, d.para);
            if (p.situacao === 'planejamento' && b.length && pode('processos.gerenciar')) L.push({ t: `Completar a instrução do ${MODALIDADES[p.modalidade].toLowerCase()} ${p.numero}`, m: `${b.length} pendência(s) antes de enviar ao jurídico`, href: `#/processos/${p.id}`, ico: 'processo' });
            else if (p.situacao === 'analise_juridica' && pode('processos.parecer')) L.push({ t: `Emitir parecer: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'balanca' });
            else if (p.situacao === 'aguardando_autorizacao' && pode('processos.autorizar')) L.push({ t: `Autorizar: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'escudo' });
            else if (!b.length) L.push({ t: `${d.rot}: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'processo' });
        });
    });
    if (pode('demandas.criar')) L.push({ t: 'Registrar uma nova demanda (DFD)', m: 'Pedido da sua unidade vinculado ao PCA', href: '#/demandas', ico: 'demanda' });
    if (pode('processos.gerenciar')) S.demandas.filter(d => d.situacao === 'enviada').forEach(d => L.push({ t: `Abrir processo para o DFD ${d.numero}`, m: d.objeto, href: '#/demandas', ico: 'demanda' }));
    if (pode('pca.aprovar')) S.pca.filter(p => p.situacao === 'rascunho').forEach(p => L.push({ t: `Aprovar o PCA ${p.ano}`, m: `${p.itens.length} itens em elaboração`, href: '#/pca/' + p.ano, ico: 'calendario' }));
    if (pode('pncp.enviar') && S.pncp.some(e => e.situacao !== 'publicado')) L.push({ t: 'Processar a fila do PNCP', m: 'Há envios aguardando', href: '#/pncp', ico: 'pncp' });
    if (pode('contratos.gerenciar')) S.contratos.filter(c => diasParaVencer(c) <= 60 && diasParaVencer(c) >= 0).forEach(c => L.push({ t: `Decidir a prorrogação do contrato ${c.numero}`, m: `Vence em ${diasParaVencer(c)} dias`, href: `#/contratos/${c.id}`, ico: 'contrato' }));
    if (pode('lgpd.gerenciar')) S.lgpd.solicitacoes.filter(s => s.situacao === 'aberta').forEach(s => L.push({ t: `Responder ao titular: ${s.protocolo}`, m: `Prazo ${dataBR(s.prazo)}`, href: '#/lgpd', ico: 'privacidade' }));
    return L.slice(0, 6);
}

function abaInstrucao(p) {

    const grupos = ['instrucao', 'juridico', 'autorizacao'].map(et => {
        const itens = L.filter(i => i.etapa === et); if (!itens.length) return '';
        return `<h3 class="sub-cap">${etRot[et]}</h3><div class="checklist">${itens.map(i => {
            const doc = p.docs[i.chave];

            return `<div class="check-item ${i.ok ? 'ok' : 'pendente'}"><span class="marca">${ico(i.ok ? 'ok' : 'relogio', 15)}</span><div style="flex:1;min-width:0"><b>${esc(i.rot)}</b><div class="base">${esc(i.base)}${i.detalhe ? ' · ' + esc(i.detalhe) : ''}${doc && doc.situacao === 'concluido' ? ` · v${doc.versao} · ${dataBR(doc.em)} · ${esc(nomeUsuario(doc.por))}` : ''}</div></div>${status}${acao}</div>`;

    return `<section class="card"><div class="row"><div><h2>Checklist da instrução</h2><p class="hint">${ehDireta(p.modalidade) ? 'Contratação direta: incisos I a VIII ' + lei('art. 72') : 'Fase preparatória ' + lei('art. 18') + ' e parecer ' + lei('art. 53')}</p></div><b class="valor">${feitos} de ${L.length}</b></div><div style="margin:12px 0 4px">${barra(feitos / L.length * 100, 'Progresso da instrução')}</div>${grupos}</section>`;
}
function abaItens(p) {

        return `<section class="card"><div class="row"><div><h2>${esc(it.descricao)}</h2><p class="hint">${num(it.qtd, 0)} ${esc(it.unidade)}</p></div><div class="btns">${edita ? `<label class="small muted" for="m-${it.id}">Método</label><select class="input input-sm" id="m-${it.id}" data-metodo data-p="${p.id}" data-it="${it.id}">${Object.entries({ mediana: 'Mediana', media: 'Média', menor: 'Menor preço' }).map(([k, v]) => `<option value="${k}" ${k === r.metodo ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn btn-s btn-sm" data-acao="cotacao-nova" data-p="${p.id}" data-it="${it.id}">${ico('mais', 16)}Cotação</button><button class="btn btn-g btn-sm btn-icone" data-acao="item-editar" data-p="${p.id}" data-it="${it.id}" aria-label="Editar item" title="Editar item">${ico('editar', 16)}</button><button class="btn btn-g btn-sm btn-icone" data-acao="item-remover" data-p="${p.id}" data-it="${it.id}" aria-label="Excluir item" title="Excluir item">${ico('lixeira', 16)}</button>` : ''}</div></div>
        <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Fonte</th><th>Data</th><th class="num">Valor unitário</th><th>Resultado</th>${edita ? '<th></th>' : ''}</tr></thead><tbody>${linhas || `<tr><td colspan="5">${vazio('Sem cotações', 'Inclua ao menos 3 preços.')}</td></tr>`}</tbody></table></div>

        ${r.alertas.map(a => `<div class="flash flash-aviso" style="margin-top:12px">${ico('alerta')}<span>${esc(a)}</span></div>`).join('')}</section>`;
    }).join('');
    return `<div class="aviso-lei">Regras aplicadas: cotação de fornecedor vale 6 meses e contratação similar vale 1 ano; preços mais de 50% acima ou abaixo da mediana são descartados; mínimo de 3 preços ${lei('art. 23')}</div>` +

function abaTramitacao(p) {
    const ds = destinos(p);

    `<div class="kpis">

      <div class="card kpi"><span class="lbl">Supressões</span><span class="val">${pct(pS)}</span><span class="foot">limite 25% ${lei('art. 125')}</span>${barra(pS / 25 * 100, 'Supressões')}</div>
    </div>
    <div class="g2"><section class="card"><h2>Dados do contrato</h2><dl class="dados">
      <div><dt>Fornecedor</dt><dd>${esc(f.nome)}<br><span class="small muted">${f.tipo === 'pf' ? esc(f.documentoMascarado) : esc(f.documento)}</span></dd></div>
      <div><dt>Processo</dt><dd>${c.processoId ? `<a href="#/processos/${c.processoId}">${esc(processo(c.processoId).numero)}</a>` : '—'}</dd></div>
      <div><dt>Gestor</dt><dd>${esc(nomeUsuario(c.gestor))}</dd></div><div><dt>Fiscal</dt><dd>${esc(nomeUsuario(c.fiscal))} ${lei('art. 117')}</dd></div>
      <div><dt>Natureza</dt><dd>${c.continuo ? 'Serviço contínuo' : 'Por escopo'}${c.reforma ? ' · reforma' : ''}</dd></div>
      <div><dt>Garantia</dt><dd>${c.garantiaPct ? pct(c.garantiaPct) + ' · ' + reais(c.valorInicial * c.garantiaPct / 100) : 'Não exigida'} ${lei('art. 96')}</dd></div>
      <div><dt>Valor inicial atualizado</dt><dd class="valor">${reais(vIA)} <span class="small muted">(com apostilamentos)</span></dd></div>
      <div><dt>PNCP</dt><dd style="word-break:break-all">${c.pncp ? esc(c.pncp) : 'Aguardando publicação'}</dd></div>

/* ---------------- render ---------------- */
function render() {
    const r = rota();
    const app = $('#app');

function podeEditarDoc(p, tipo) {
    if (tipo === 'parecer_juridico') return pode('processos.parecer') && p.situacao === 'analise_juridica';
    if (tipo === 'autorizacao') return pode('processos.autorizar') && p.situacao === 'aguardando_autorizacao';
    return pode('processos.gerenciar') && p.situacao === 'planejamento';
}
function abrirDoc(pid, tipo) {

      ${concl ? `<div class="full flash flash-ok">${ico('cadeado')}<span>Peça concluída e travada. Hash do conteúdo: <code class="hash">${doc.hash.slice(0, 24)}…</code>. Para corrigir, crie uma nova versão.</span></div>` : ''}

const ata = id => S.atas.find(a => a.id === id);

const recebido = (o, tipo) => o.recebimentos.filter(r => r.tipo === tipo).reduce((s, r) => s + r.qtd, 0);
const SIT_REQ = { solicitada: ['Aguardando decisão', 'b-info'], aprovada: ['Aprovada', 'b-ok'], recusada: ['Recusada', 'b-err'], atendida: ['Ordem emitida', 'b-ok'], cancelada: ['Cancelada', 'b-mute'] };

function alertas() {
    const L = [], H = hoje();
    S.contratos.forEach(c => { const d = diasParaVencer(c); const m = MARCOS_CONTRATO.find(x => d <= x); if (d < 0) L.push({ nivel: 'b-err', t: `Contrato ${c.numero} venceu há ${-d} dias`, m: c.objeto, href: `#/contratos/${c.id}` }); else if (m) L.push({ nivel: d <= 30 ? 'b-warn' : 'b-info', t: `Contrato ${c.numero} vence em ${d} dias`, m: `Marco de ${m} dias · decida a prorrogação ou a nova contratação (art. 107)`, href: `#/contratos/${c.id}` }); });
    S.atas.forEach(a => { const d = diasEntre(H, a.fim); const m = MARCOS_ATA.find(x => d <= x); if (d >= 0 && m) L.push({ nivel: d <= 30 ? 'b-warn' : 'b-info', t: `Ata ${a.numero} vence em ${d} dias`, m: 'Vigência de 1 ano, prorrogável por igual período se vantajosa (art. 84)', href: '#/atas' }); });
    S.ordens.forEach(o => { if (!['entregue', 'cancelada'].includes(o.situacao) && o.prazo < H && recebido(o, 'provisorio') < o.qtd) L.push({ nivel: 'b-err', t: `${o.numero}: entrega atrasada`, m: `Prazo era ${dataBR(o.prazo)}`, href: '#/ordens' }); if (o.situacao === 'parcial' && recebido(o, 'provisorio') > recebido(o, 'definitivo')) L.push({ nivel: 'b-info', t: `${o.numero}: falta o recebimento definitivo`, m: 'Por servidor ou comissão diferente de quem recebeu provisoriamente (art. 140)', href: '#/ordens' }); });
    S.requisicoes.filter(r => r.situacao === 'solicitada').forEach(r => L.push({ nivel: 'b-info', t: `Requisição ${r.numero} aguardando decisão`, m: `${r.qtd} ${itemAta(ata(r.ataId), r.itemId).unidade} · ${r.unidade}`, href: '#/ordens' }));

}

function indicadores() {
    const ano = Number(hoje().slice(0, 4));
    const pca = S.pca.find(p => p.ano === ano) || S.pca[0];
    const totalPca = pca.itens.reduce((s, i) => s + i.valor, 0);
    const comProcesso = pca.itens.filter(i => S.demandas.some(d => d.itemPca === i.id && d.processoId) || S.processos.some(p => p.natureza === i.natureza && p.ano === ano && p.objeto.toLowerCase().includes(i.descricao.split(' ')[0].toLowerCase())));
    const execPca = comProcesso.reduce((s, i) => s + i.valor, 0);
    const doAno = S.processos.filter(p => p.ano === ano);
    const diretas = doAno.filter(p => ehDireta(p.modalidade));
    const vDir = diretas.reduce((s, p) => s + valorProcesso(p), 0), vTot = doAno.reduce((s, p) => s + valorProcesso(p), 0);
    const contratados = S.contratos.map(c => ({ c, p: processo(c.processoId) })).filter(x => x.p);
    const est = contratados.reduce((s, x) => s + valorProcesso(x.p), 0), ctr = contratados.reduce((s, x) => s + x.c.valorInicial, 0);
    const prep = S.processos.map(p => { const a = p.eventos.find(e => e.para === 'planejamento'), b = p.eventos.find(e => e.para === 'publicado'); return a && b ? diasEntre(a.em, b.em) : null; }).filter(x => x !== null);
    const alvo = S.usuarios.filter(u => ['agente-contratacao', 'planejamento', 'gestor-contrato'].includes(u.perfil));
    const capac = alvo.filter(u => S.capacitacoes.some(k => k.userId === u.id && capacitacaoVigente(k)));
    return { ano, pca, totalPca, execPca, diretas, vDir, vTot, doAno, est, ctr, prep, alvo, capac };
}

function sugestaoIa(p, tipo, campo, rot) {

        vi_estimativa_valor: 'Estimativa pela mediana das cotações válidas da pesquisa de preços, com fontes do art. 23, § 1º. [Confira a planilha de preços.]',
        viii_parcelamento: 'Avalie se a divisão em itens ou lotes amplia a competição sem perda de economia de escala (art. 40, V, b). [Justifique a escolha.]',
        xiii_viabilidade: 'Diante do exposto, a contratação se mostra [viável/inviável] e adequada ao atendimento da necessidade. [Confirme após revisar o estudo.]',

function decidirRequisicao(id, aprovar, motivo) {

}

function baixar(nome, conteudo, tipo) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo + ';charset=utf-8' })); a.download = nome;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

        { id: uid(), processoId: 'p4', peca: 'termo_referencia', versao: 1, para: ['u4', 'u2'], feitas: {} },
    ];
    S.fluxosSec = S.fluxosSec || [
        { id: uid(), nome: 'Pregão eletrônico (geral)', modalidade: 6, unidade: '', roteiro: ['SEMAD', 'DLC', 'PGM', 'GAB', 'DLC'] },

    ];

}

/* Livro de ocorrências: cada registro leva o hash do anterior (art. 117, § 1º). */
function registrarOcorrencia(c, o) {
    const ant = c.ocorrencias.length ? c.ocorrencias[c.ocorrencias.length - 1].hash : '0'.repeat(64);
    const r = Object.assign({ id: uid(), numero: c.ocorrencias.length + 1, hashAnterior: ant }, o);
    r.hash = sha256(JSON.stringify([r.numero, r.tipo, r.descricao, r.providencias || '', r.prazo || '', r.por, r.em, ant]));
    c.ocorrencias.push(r);
    return r;
}
const livroIntegro = c => { let ant = '0'.repeat(64); return c.ocorrencias.every(r => { const ok = r.hashAnterior === ant && r.hash === sha256(JSON.stringify([r.numero, r.tipo, r.descricao, r.providencias || '', r.prazo || '', r.por, r.em, ant])); ant = r.hash; return ok; }); };

/* Eficácia do contrato (art. 94): publicar no PNCP em 20 dias úteis (licitação) ou 10 (contratação direta). */
function eficacia(c) {
    const p = c.processoId ? processo(c.processoId) : null;
    const direta = !p || ehDireta(p.modalidade);
    const limite = diasUteisSoma(c.assinatura || c.inicio, direta ? 10 : 20);
    if (c.pncp) return { ok: true, limite, base: direta ? 'art. 94, II' : 'art. 94, I' };
    return { ok: false, limite, vencido: hoje() > limite, base: direta ? 'art. 94, II' : 'art. 94, I' };
}
function bannerEficacia(c) {
    const e = eficacia(c);
    if (e.ok) return `<div class="aviso-lei">${ico('ok', 16)} Contrato divulgado no PNCP: eficaz ${lei(e.base)}.</div>`;
    return `<div class="aviso-lei" style="border-color:#E8A5A5;background:#FDF1F1"><b>${e.vencido ? 'Prazo de divulgação vencido.' : 'Contrato ainda sem eficácia.'}</b> A divulgação no PNCP é condição de eficácia ${lei(e.base)}: prazo até ${dataBR(e.limite)} (dias úteis). Até lá, o sistema não deixa registrar medição, liquidar nem pagar. Envie pela fila do PNCP.</div>`;
}

/* ---- ocorrências e designação no contrato ---- */
function secaoOcorrencias(c) {

/* ---- CEIS e CNEP (art. 161) ---- */
function botaoCeis(f) { return pode('fornecedores.ver') ? `<button class="btn btn-g btn-sm" data-acao="ceis" data-f="${f.id}">${ico('busca', 16)}CEIS/CNEP</button>` : ''; }
function resumoCeis(f) {

}

/* ---- fluxo e roteiro ---- */
function fluxoDo(p) {
    const pontos = f => (f.modalidade && Number(f.modalidade) !== Number(p.modalidade)) || (f.unidade && f.unidade !== p.unidadeOrigem) ? -1 : (f.unidade ? 8 : 0) + (f.modalidade ? 4 : 0);
    return (S.fluxosSec || []).map(f => [f, pontos(f)]).filter(x => x[1] >= 0).sort((a, b) => b[1] - a[1]).map(x => x[0])[0] || null;
}
function proximaDoRoteiro(p) {
    const f = fluxoDo(p); if (!f || !f.roteiro.length) return null;
    const i = f.roteiro.indexOf(p.unidadeAtual);
    return i < 0 ? (f.roteiro[0] !== p.unidadeAtual ? f.roteiro[0] : f.roteiro[1] || null) : f.roteiro[i + 1] || null;
}

/* ---- abas novas do processo ---- */

        } else if (arq) {

    // Permanência: da abertura (ou recebimento) até a saída de cada unidade; trânsito do envio ao recebimento.
    const per = []; let un = (p.tramites.find(t => t.tipo === 'remessa' && !t.canceladoEm) || {}).de || p.unidadeAtual, ini = p.criado + 'T08:00:00', resp = null;

    const f = fluxoDo(p);
    return `<div class="g2"><section class="card"><h2>Onde o processo está</h2><dl class="dados"><div><dt>Unidade atual</dt><dd>${siglaUn(p.unidadeAtual)} · ${esc(UNIDADES[p.unidadeAtual] || '')}</dd></div><div><dt>Situação dos autos</dt><dd>${situ}</dd></div><div><dt>Unidade de origem</dt><dd>${siglaUn(p.unidadeOrigem)}</dd></div><div><dt>Fluxo aplicado</dt><dd>${f ? esc(f.nome) + `<div class="small muted">Roteiro: ${f.roteiro.map(esc).join(' → ')}</div>` : '—'}</dd></div></dl>

    <section class="card card-flush"><div style="padding:18px 20px 0"><h2>Na unidade ${badge(String(na.length), 'b-info')}</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Processo</th><th>Fase</th><th>Unidade</th><th class="num">Dias na unidade</th></tr></thead><tbody>

/* PDF único: página pronta para imprimir ou salvar em PDF, com a folha no rodapé. */
function pdfAutos(p) {
    const L = autosDo(p).filter(d => !(d.j && d.j.desentranhadoEm));
    const corpo = L.map(d => {
        let c = '';
        if (d.tipo === 'peca') { const doc = p.docs[d.ref]; c = Object.entries(DOCS[d.ref].campos).map(([k, [rot]]) => `<h3>${esc(rot)}</h3><p>${esc((doc.campos || {})[k] || 'Não preenchido.')}</p>`).join('') + `<p class="m">SHA-256 da peça: ${esc(doc.hash || sha256(JSON.stringify(doc.campos)))}</p>`; }
        else if (d.tipo === 'contrato') { const k = contrato(d.ref); c = `<p>Contratada: ${esc(fornecedor(k.fornecedorId).nome)} · Valor inicial: ${reais(k.valorInicial)} · Vigência: ${dataBR(k.inicio)} a ${dataBR(k.fim)}${k.pncp ? ' · PNCP ' + esc(k.pncp) : ''}</p>`; }
        else c = `<div class="termo"><b>Termo de juntada.</b> Em ${dataHoraBR(d.em)} foi juntado aos autos "${esc(d.titulo)}" (${esc(d.base)}), arquivo ${esc(d.j.arquivo)}, ${num(d.j.tamanho / 1024, 0)} KB${d.j.paginas ? ', ' + d.j.paginas + ' página(s)' : ''}, por ${esc(d.autor)}. SHA-256 ${esc(d.j.hash)}. O arquivo original acompanha o processo eletrônico.</div>`;
        return `<section class="doc"><h2>${d.numero}. ${esc(d.titulo)}</h2><p class="m">${esc(d.base)} · ${dataHoraBR(d.em)}${d.autor ? ' · ' + esc(d.autor) : ''}</p>${c}</section>`;
    }).join('');
    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Autos do processo ${esc(p.numero)}</title><style>
      @page { size: A4; margin: 2cm 2cm 2.4cm; @bottom-center { content: "Processo ${esc(p.numero)} · fl. " counter(page) " de " counter(pages); font: 8pt Arial; color: #4a5b68; } }
      body { font: 11pt/1.5 Arial, sans-serif; color: #1b2a35; max-width: 800px; margin: 24px auto; padding: 0 20px; } h1 { color: #1E5470; font-size: 18pt; } h2 { color: #1E5470; font-size: 13pt; } h3 { font-size: 11pt; margin: 12px 0 2px; }
      .m { color: #4a5b68; font-size: 9pt; } table { border-collapse: collapse; width: 100%; font-size: 10pt; } td, th { border: 1px solid #c9d6de; padding: 4px 6px; text-align: left; } th { background: #D1ECFF; }
      .doc { page-break-before: always; } .termo { border: 1px solid #c9d6de; padding: 10px 12px; } .imp { position: fixed; top: 10px; right: 10px; } @media print { .imp { display: none; } }
    </style></head><body><button class="imp" onclick="print()">Imprimir ou salvar em PDF</button><h1>Autos do processo ${esc(p.numero)}</h1><p><b>${esc(S.orgao.nome)}</b> · CNPJ ${esc(S.orgao.cnpj)}<br><b>Objeto:</b> ${esc(p.objeto)}<br><b>Modalidade:</b> ${esc(MODALIDADES[p.modalidade])} · <b>Fase:</b> ${esc(SITUACOES[p.situacao][0])} · <b>Unidade atual:</b> ${esc(p.unidadeAtual)}</p>
      <h2>Índice</h2><table><tr><th>Nº</th><th>Data</th><th>Documento</th><th>Responsável</th></tr>${L.map(d => `<tr><td>${d.numero}</td><td>${dataHoraBR(d.em)}</td><td>${esc(d.titulo)}</td><td>${esc(d.autor || '—')}</td></tr>`).join('')}</table>${corpo}
      <p class="m" style="margin-top:30px">Demonstração com dados fictícios. No sistema instalado, o PDF é gerado no servidor, com "fl. N de T" em cada página e as imagens juntadas dentro do arquivo.</p></body></html>`;
    const w = window.open('', '_blank');
    if (!w) return toast('O navegador bloqueou a nova janela. Permita pop-ups para ver o PDF.', 'erro');
    w.document.write(html); w.document.close();
}

const UF_MUN = { 'Vale Verde': 'RR', 'Boa Vista': 'RR', 'Manaus': 'AM' };
function dadosPaineis() {
    const ano = Number(hoje().slice(0, 4));
    const porUn = {};
    S.processos.forEach(p => { const u = p.unidadeOrigem || 'SEMAD'; const x = porUn[u] = porUn[u] || { unidade: u, processos: 0, andamento: 0, valor: 0, contratos: 0, valorContratos: 0 }; x.processos++; if (!['contratado', 'deserto', 'fracassado', 'revogado', 'anulado'].includes(p.situacao)) x.andamento++; x.valor += valorProcesso(p); });
    S.contratos.forEach(c => { const p = processo(c.processoId); const u = (p && p.unidadeOrigem) || 'SEMAD'; const x = porUn[u] = porUn[u] || { unidade: u, processos: 0, andamento: 0, valor: 0, contratos: 0, valorContratos: 0 }; x.contratos++; x.valorContratos += c.valorInicial; });
    const total = Object.values(porUn).reduce((s, x) => s + x.valor, 0) || 1;
    const sec = Object.values(porUn).sort((a, b) => b.valor - a.valor).map(x => Object.assign(x, { part: x.valor / total * 100 }));
    const ct = S.contratos.map(c => ({ c, f: fornecedor(c.fornecedorId) }));
    const vT = ct.reduce((s, x) => s + x.c.valorInicial, 0) || 1;
    const porte = {}; ct.forEach(({ c, f }) => { porte[f.porte] = (porte[f.porte] || 0) + c.valorInicial; });
    const fom = { local: 0, regional: 0, fora: 0 }; ct.forEach(({ c, f }) => { const k = f.municipio === 'Vale Verde' ? 'local' : UF_MUN[f.municipio] === 'RR' ? 'regional' : 'fora'; fom[k] += c.valorInicial; });
    return { ano, sec, porte, fom, vT };
}

    if (t.matches('[data-metodo]')) { const it = processo(t.dataset.p).itens.find(i => i.id === t.dataset.it); it.metodo = t.value; auditar('Método da pesquisa alterado', it.descricao, t.value); atualizar(); return; }
    if (t.matches('[data-auto]')) {
        const f = t.form; const d = new FormData(f);
        S.simDisp = { ano: d.get('ano'), categoria: d.get('categoria'), natureza: d.get('natureza'), valor: d.get('valor') };
        const dobro = f.querySelector('[name=dobro]'); if (!dobro.disabled) S.orgao.dobro = dobro.checked;
        atualizar();
        const foco = document.getElementById(t.id); if (foco) foco.focus();
    }
});
