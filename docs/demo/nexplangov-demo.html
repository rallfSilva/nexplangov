:root {
  color-scheme: light;
  --font-sans: 'Plus Jakarta Sans Variable', 'Segoe UI', system-ui, sans-serif;
  --color-marinho: #1E5470; --color-azul: #34729C; --color-celeste: #6CB1DA; --color-turquesa: #6EC1D1; --color-gelo: #D1ECFF; --color-agua: #CBEAEC;
  --color-tinta: #0F2A3A; --color-texto2: #4A6273; --color-linha: #E1EBF2; --color-fundo: #F3F7FA;
  --color-sucesso: #1F8A70; --color-alerta: #C2410C; --color-perigo: #B42318;
  --ease-suave: cubic-bezier(.2, .8, .2, 1); --dur-rapida: 140ms; --dur-media: 240ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { margin: 0; }

    body { background: var(--color-fundo); color: var(--color-tinta); -webkit-font-smoothing: antialiased; }
    a { color: var(--color-azul); }
    a:hover { color: var(--color-marinho); }
    :focus-visible { outline: 3px solid var(--color-celeste); outline-offset: 2px; }

    .app { display: flex; min-height: 100vh; }
    .side { width: 264px; flex: none; background: var(--color-marinho); color: var(--color-gelo); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--color-turquesa); color: var(--color-marinho); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex: none; }
    .brand b { display: block; color: #fff; font-size: 16px; letter-spacing: -.01em; }
    .brand small { display: block; color: #A9D2EE; font-size: 12px; margin-top: 2px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8EC3E3; padding: 12px 12px 6px; font-weight: 600; }
    .nav a, .nav span.soon { white-space: nowrap; display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 44px; border-radius: 10px; color: var(--color-gelo); text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav a.on { background: var(--color-azul); color: #fff; font-weight: 600; }
    .nav span.soon { color: #A9D2EE; cursor: default; }
    .nav span.soon em { margin-left: auto; font-style: normal; font-size: 10.5px; background: rgba(255,255,255,.1); padding: 2px 8px; border-radius: 99px; }
    .side .foot { margin-top: auto; padding: 14px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 12px; color: #CDE7F7; line-height: 1.5; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 32px; background: #fff; border-bottom: 1px solid var(--color-linha); }
    .org { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--color-texto2); }
    .org b { color: var(--color-tinta); font-size: 14px; }
    .me { display: flex; align-items: center; gap: 12px; }
    .me .who { text-align: right; font-size: 13px; line-height: 1.3; }
    .me .who b { display: block; font-size: 14px; }
    .me .who span { color: var(--color-texto2); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--color-gelo); color: var(--color-marinho); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
    .icobtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5E3EC; background: #fff; color: var(--color-marinho); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .icobtn:hover { background: #F0F7FC; }

    .content { padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; width: 100%; }
    .h1 { font-size: 28px; font-weight: 800; letter-spacing: -.025em; margin: 0; }
    .sub { color: var(--color-texto2); font-size: 14px; margin: 6px 0 0; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn-p { background: var(--color-azul); color: #fff; }
    .btn-p:hover { background: var(--color-marinho); color: #fff; }

    /* ===== Design system NexPlanGov: camada premium ===== */

    .card { transition: box-shadow var(--dur-media) var(--ease-suave), transform var(--dur-media) var(--ease-suave), border-color var(--dur-media) var(--ease-suave); }
    a.card:hover, .card-link:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(30,84,112,.06), 0 18px 34px -18px rgba(30,84,112,.32); border-color: #C9DCE8; }
    .input, select.input, textarea.input { transition: border-color var(--dur-rapida) var(--ease-suave), box-shadow var(--dur-media) var(--ease-suave); }
    textarea.input { min-height: 96px; padding: 12px 14px; line-height: 1.5; resize: vertical; }
    .side { background: linear-gradient(180deg, #1E5470 0%, #17445B 100%); }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }

    @media (max-width: 960px) {

        .auth-hero { padding: 32px 24px; }
        .auth-hero h1 { font-size: 30px; }
        .auth-pontos { display: none; }
    }

    }

#modal[hidden] { display: none; }
#modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-fundo { position: absolute; inset: 0; background: rgba(15,42,58,.45); backdrop-filter: blur(3px); animation: aparecer var(--dur-media) var(--ease-suave); }
.modal-caixa { position: relative; background: #fff; border-radius: 20px; width: 100%; max-width: 620px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 30px 80px -20px rgba(15,42,58,.5); animation: subir 280ms var(--ease-suave); }
.modal-caixa.largo { max-width: 860px; }
.modal-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--color-linha); }
.modal-topo h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.modal-corpo { padding: 20px 22px 22px; overflow-y: auto; }
body.com-modal { overflow: hidden; }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
/* Toasts */
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 10px; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; background: #0F2A3A; color: #fff; font-size: 14px; box-shadow: 0 16px 40px -16px rgba(15,42,58,.6); animation: subir 280ms var(--ease-suave); transition: opacity 400ms, transform 400ms var(--ease-suave); }
.toast svg { flex: none; color: var(--color-turquesa); margin-top: 1px; }
.toast-erro { background: #7F1414; } .toast-erro svg { color: #FECACA; }
.toast.sai { opacity: 0; transform: translateY(8px); }
@media (max-width: 860px) { .troca select { max-width: 180px; } .brand svg { width: 160px; } .pub-top { padding: 14px 16px; } .trans { flex-direction: column; align-items: flex-start; } }
a.card, a.card:hover { text-decoration: none; color: inherit; }
code.hash { white-space: nowrap; }
.tbl td code.hash { display: inline-block; }

</style>

const CHAVE = 'nexplangov-demo-v1';

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reais = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (v, d = 2) => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => num(v, 1) + '%';
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const hoje = () => iso(new Date());
const dt = s => new Date(s + 'T12:00:00');
const somaDias = (n, base) => { const d = base ? dt(base) : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const somaMeses = (n, base) => { const d = base ? dt(base) : new Date(); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return iso(d); };
const dataBR = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const dataHoraBR = s => { const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const diasEntre = (a, b) => Math.round((dt(b) - dt(a)) / 86400000);
const mesesEntre = (a, b) => { const x = dt(a), y = dt(b); return (y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth()) + (y.getDate() >= x.getDate() ? 0 : -1); };
const uid = () => Math.random().toString(36).slice(2, 10);
const ico = (n, t = 18) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n] || ''}</svg>`;
const lei = t => `<span class="lei">${esc(t)}</span>`;
const soDigitos = s => String(s || '').replace(/\D/g, '');

/* SHA-256 (FIPS 180-4), para a cadeia da auditoria e o hash das peças. */
const sha256 = (function () {
    const K = [], H0 = [];
    const primo = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
    for (let p = 2, c = 0; c < 64; p++) if (primo(p)) { if (c < 8) H0[c] = (Math.pow(p, 1 / 2) * 4294967296) | 0; K[c++] = (Math.pow(p, 1 / 3) * 4294967296) | 0; }
    const rr = (v, n) => (v >>> n) | (v << (32 - n));
    return function (texto) {
        const b = new TextEncoder().encode(String(texto)), l = b.length, n = Math.ceil((l + 9) / 64) * 64;
        const m = new Uint8Array(n); m.set(b); m[l] = 0x80;
        const dv = new DataView(m.buffer); const bits = l * 8;
        dv.setUint32(n - 4, bits >>> 0); dv.setUint32(n - 8, Math.floor(bits / 4294967296));
        const h = H0.slice(), w = new Array(64);
        for (let o = 0; o < n; o += 64) {
            for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
            for (let i = 16; i < 64; i++) {
                const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
            }
            let [a, bb, c, d, e, f, g, hh] = h;
            for (let i = 0; i < 64; i++) {
                const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
                const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
                hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
            }
            h[0] = (h[0] + a) | 0; h[1] = (h[1] + bb) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
            h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
        }
        return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    };

function mediana(v) { const a = [...v].sort((x, y) => x - y); const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

/** Pesquisa de preços (art. 23): validade, destoantes (50% da mediana), método e mínimo de 3 preços. */
function pesquisa(item, ref = hoje()) {
    const descartadas = {}, cand = {}, alertas = [];
    item.cotacoes.forEach((c, i) => {
        const v = Number(c.valor), f = FONTES[c.fonte];
        if (v <= 0) { descartadas[i] = 'Valor zerado ou negativo.'; return; }
        if (c.data > ref) { descartadas[i] = 'Data posterior à data da pesquisa.'; return; }
        if (f.val && c.data < somaMeses(-f.val, ref)) { descartadas[i] = `Fora da validade: ${f.rot.toLowerCase()} aceita no máximo ${f.val} meses.`; return; }
        cand[i] = v;
    });
    if (Object.keys(cand).length >= 3) {
        const md = mediana(Object.values(cand));
        for (const i of Object.keys(cand)) {
            if (cand[i] > md * 1.5) { descartadas[i] = 'Excessivamente elevada: mais de 50% acima da mediana.'; delete cand[i]; }
            else if (cand[i] < md * 0.5) { descartadas[i] = 'Possivelmente inexequível: mais de 50% abaixo da mediana.'; delete cand[i]; }
        }
    }
    const vals = Object.values(cand);
    if (vals.length < 3) alertas.push('Menos de 3 preços válidos. Junte mais cotações ou justifique no processo (art. 23, § 1º).');
    const forn = Object.keys(cand).filter(i => item.cotacoes[i].fonte === 'fornecedor');
    if (forn.length && forn.length < 3 && forn.length === vals.length) alertas.push('Pesquisa direta com fornecedores exige no mínimo 3 orçamentos (art. 23, § 1º, IV).');
    const metodo = item.metodo || 'mediana';
    const valor = !vals.length ? 0 : metodo === 'media' ? vals.reduce((s, x) => s + x, 0) / vals.length : metodo === 'menor' ? Math.min(...vals) : mediana(vals);
    return { valor: Math.round(valor * 100) / 100, validas: Object.keys(cand).map(Number), descartadas, alertas, cv: cv(vals), metodo };
}

}

            if (p.situacao === 'planejamento' && b.length && pode('processos.gerenciar')) L.push({ t: `Completar a instrução do ${MODALIDADES[p.modalidade].toLowerCase()} ${p.numero}`, m: `${b.length} pendência(s) antes de enviar ao jurídico`, href: `#/processos/${p.id}`, ico: 'processo' });
            else if (p.situacao === 'analise_juridica' && pode('processos.parecer')) L.push({ t: `Emitir parecer: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'balanca' });
            else if (p.situacao === 'aguardando_autorizacao' && pode('processos.autorizar')) L.push({ t: `Autorizar: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'escudo' });
            else if (!b.length) L.push({ t: `${d.rot}: ${p.numero}`, m: p.objeto, href: `#/processos/${p.id}`, ico: 'processo' });
        });
    });
    if (pode('demandas.criar')) L.push({ t: 'Registrar uma nova demanda (DFD)', m: 'Pedido da sua unidade vinculado ao PCA', href: '#/demandas', ico: 'demanda' });
    if (pode('processos.gerenciar')) S.demandas.filter(d => d.situacao === 'enviada').forEach(d => L.push({ t: `Abrir processo para o DFD ${d.numero}`, m: d.objeto, href: '#/demandas', ico: 'demanda' }));
    if (pode('pca.aprovar')) S.pca.filter(p => p.situacao === 'rascunho').forEach(p => L.push({ t: `Aprovar o PCA ${p.ano}`, m: `${p.itens.length} itens em elaboração`, href: '#/pca/' + p.ano, ico: 'calendario' }));
    if (pode('pncp.enviar') && S.pncp.some(e => e.situacao !== 'publicado')) L.push({ t: 'Processar a fila do PNCP', m: 'Há envios aguardando', href: '#/pncp', ico: 'pncp' });
    if (pode('contratos.gerenciar')) S.contratos.filter(c => diasParaVencer(c) <= 60 && diasParaVencer(c) >= 0).forEach(c => L.push({ t: `Decidir a prorrogação do contrato ${c.numero}`, m: `Vence em ${diasParaVencer(c)} dias`, href: `#/contratos/${c.id}`, ico: 'contrato' }));
    if (pode('lgpd.gerenciar')) S.lgpd.solicitacoes.filter(s => s.situacao === 'aberta').forEach(s => L.push({ t: `Responder ao titular: ${s.protocolo}`, m: `Prazo ${dataBR(s.prazo)}`, href: '#/lgpd', ico: 'privacidade' }));
    return L.slice(0, 6);
}

function telaPca(anoSel) {
    const anos = S.pca.map(p => p.ano);
    const ano = Number(anoSel) || anos[0];
    const pl = S.pca.find(p => p.ano === ano);
    const total = pl.itens.reduce((s, i) => s + i.valor, 0);
    const porNat = {}; pl.itens.forEach(i => porNat[i.natureza] = (porNat[i.natureza] || 0) + i.valor);
    const bot = [
        pl.situacao === 'rascunho' && pode('pca.gerenciar') ? `<button class="btn btn-p" data-acao="pca-item" data-ano="${ano}">${ico('mais', 16)}Incluir item</button>` : '',
        pl.situacao === 'rascunho' && pode('pca.aprovar') ? `<button class="btn btn-t" data-acao="pca-aprovar" data-ano="${ano}">${ico('ok', 16)}Aprovar o plano</button>` : '',
        pl.situacao === 'aprovado' && !pl.pncp && pode('pncp.enviar') ? `<button class="btn btn-s" data-acao="pca-pncp" data-ano="${ano}">${ico('enviar', 16)}Enviar ao PNCP</button>` : '',
    ].join('');
    return cab('Plano de Contratações Anual', `Planejamento do exercício, por natureza de despesa ${lei('art. 12, VII')}`, bot) +
    `<div class="abas" role="tablist">${anos.map(a => `<a href="#/pca/${a}" class="${a === ano ? 'on' : ''}" role="tab" aria-selected="${a === ano}">PCA ${a}</a>`).join('')}</div>
    <div class="kpis">
      <div class="card kpi"><span class="lbl">Valor total</span><span class="val valor">${reais(total)}</span><span class="foot">${pl.itens.length} itens</span></div>
      <div class="card kpi"><span class="lbl">Situação</span><span class="val" style="font-size:22px">${pl.situacao === 'aprovado' ? badge('Aprovado', 'b-ok') : badge('Em elaboração', 'b-warn')}</span><span class="foot">${pl.aprovadoEm ? 'Aprovado em ' + dataBR(pl.aprovadoEm) : 'Aprovação pela autoridade competente'}</span></div>
      <div class="card kpi"><span class="lbl">PNCP</span><span class="val" style="font-size:15px;word-break:break-all">${pl.pncp ? esc(pl.pncp) : '—'}</span><span class="foot">${pl.pncp ? 'Número de controle' : 'Ainda não publicado'}</span></div>
    </div>
    <section class="card card-flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Natureza</th><th>Unidade</th><th>Trimestre</th><th class="num">Valor estimado</th></tr></thead><tbody>
    ${pl.itens.map((i, n) => `<tr><td><b>${n + 1}. ${esc(i.descricao)}</b><div class="small muted">${esc(CATEGORIAS[i.categoria])}</div></td><td><span class="sigla">${i.natureza}</span><div class="small muted">${esc(NATUREZAS[i.natureza])}</div></td><td>${esc(i.unidade)}</td><td>${i.trimestre}º</td><td class="num valor">${reais(i.valor)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="card"><h2>Por natureza de despesa</h2><p class="hint">Base para controlar o fracionamento nas dispensas ${lei('art. 75, § 1º')}</p><div class="list">${Object.entries(porNat).sort((a, b) => b[1] - a[1]).map(([n, v]) => `<div class="li" style="display:block"><div class="row"><span><b>${n}</b> <span class="muted small">${esc(NATUREZAS[n])}</span></span><b class="valor">${reais(v)}</b></div><div style="margin-top:8px">${barra(v / total * 100, 'Participação de ' + n)}</div></div>`).join('')}</div></section>`;
}

function telaDemandas() {
    const bot = pode('demandas.criar') ? `<button class="btn btn-p" data-acao="demanda-nova">${ico('mais', 16)}Nova demanda (DFD)</button>` : '';

    ${S.demandas.map(d => { const it = S.pca.flatMap(p => p.itens).find(i => i.id === d.itemPca); return `<tr><td><b>${esc(d.numero)}</b><div class="small muted">${dataBR(d.data)}</div></td><td>${esc(d.objeto)}<div class="small muted">${esc(nomeUsuario(d.solicitante))}</div></td><td>${esc(d.unidade)}</td><td>${it ? esc(it.descricao) : badge('Fora do PCA', 'b-warn')}</td><td class="num valor">${reais(d.valor)}</td><td>${d.situacao === 'em_processo' ? badge('Em processo', 'b-ok') : badge('Aguardando', 'b-info')}</td><td class="acoes">${d.processoId ? `<a class="btn btn-g btn-sm" href="#/processos/${d.processoId}">Ver processo</a>` : pode('processos.gerenciar') ? `<button class="btn btn-s btn-sm" data-acao="processo-novo" data-demanda="${d.id}">Abrir processo</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></section>`;
}

function telaProcessos() {
    const bot = pode('processos.gerenciar') ? `<button class="btn btn-p" data-acao="processo-novo">${ico('mais', 16)}Novo processo</button>` : '';
    return cab('Processos de contratação', 'Licitações e contratações diretas, da instrução à publicação', bot) +
    `<section class="card card-flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Número</th><th>Objeto</th><th>Modalidade</th><th class="num">Valor estimado</th><th>Situação</th><th>PNCP</th></tr></thead><tbody>
    ${S.processos.map(p => `<tr class="linha-link" data-href="#/processos/${p.id}"><td><a href="#/processos/${p.id}"><b>${esc(p.numero)}</b></a></td><td>${esc(p.objeto)}</td><td>${esc(MODALIDADES[p.modalidade])}<div class="small muted">${esc((AMPAROS[p.amparo] || {}).rot || '')}</div></td><td class="num valor">${reais(valorProcesso(p))}</td><td>${badgeSit(p.situacao)}</td><td>${p.pncp ? badge('Publicado', 'b-ok') : badge('—', 'b-mute')}</td></tr>`).join('')}
    </tbody></table></div></section>`;

function telaProcesso(id, aba = 'instrucao') {
    const p = processo(id); if (!p) return vazio('Processo não encontrado');
    const etapas = ehDireta(p.modalidade) ? ETAPAS_DIR : ETAPAS_LIC;
    const idx = etapas.indexOf(p.situacao);
    const encerradoSem = ['deserto', 'fracassado', 'revogado', 'anulado'].includes(p.situacao);
    const stepper = `<div class="etapas" aria-label="Etapas do processo">${etapas.map((e, i) => `<div class="etapa ${i < idx || p.situacao === 'contratado' ? 'feita' : i === idx ? 'atual' : ''}"><span class="bola">${i < idx || p.situacao === 'contratado' ? ico('ok', 14) : i + 1}</span>${esc(SITUACOES[e][0])}</div>`).join('')}</div>`;
    const abas = [['instrucao', 'Instrução'], ['itens', 'Itens e pesquisa de preços'], ['tramitacao', 'Tramitação'], ['historico', 'Linha do tempo'], ['pncp', 'PNCP']];
    let corpo = '';
    if (aba === 'instrucao') corpo = abaInstrucao(p);
    if (aba === 'itens') corpo = abaItens(p);
    if (aba === 'tramitacao') corpo = abaTramitacao(p);
    if (aba === 'historico') corpo = `<section class="card"><h2>Linha do tempo</h2><div class="tempo">${p.eventos.slice().reverse().map(e => `<div class="ev"><span class="ponto"></span><div><b>${e.de ? esc(SITUACOES[e.de][0]) + ' → ' : ''}${esc(SITUACOES[e.para][0])}</b><div class="small muted">${dataBR(e.em)} · ${esc(nomeUsuario(e.por))}</div>${e.obs ? `<div class="small" style="margin-top:4px">${esc(e.obs)}</div>` : ''}</div></div>`).join('')}</div></section>`;
    if (aba === 'pncp') { const env = S.pncp.filter(e => e.tipo === 'compra' && e.ref === p.id); corpo = `<section class="card"><h2>Publicação no PNCP</h2><p class="hint">Edital ou aviso de contratação direta, atas e resultado ${lei('art. 174')}</p><dl class="dados"><div><dt>Número de controle</dt><dd>${p.pncp ? esc(p.pncp) : 'Ainda não publicado'}</dd></div><div><dt>Envios</dt><dd>${env.length}</dd></div></dl>${env.length ? `<div class="list">${env.map(e => `<div class="li">${ico('pncp')}<div><b>${esc(e.operacao === 'inserir' ? 'Inclusão' : 'Retificação')}</b><div class="meta">${esc(e.log[0] ? e.log[0].msg : 'Aguardando processamento')}</div></div><span class="r">${badgePncp(e)}</span></div>`).join('')}</div>` : ''}<div class="btns" style="margin-top:14px"><button class="btn btn-s" data-acao="pncp-payload" data-tipo="compra" data-ref="${p.id}">${ico('api', 16)}Ver os dados que vão ao PNCP</button></div></section>`; }
    return `<div><a href="#/processos" class="small" style="font-weight:600;display:inline-flex;gap:4px;align-items:center">${ico('voltar', 16)}Processos</a></div>` +
    cab(`${esc(MODALIDADES[p.modalidade])} ${esc(p.numero)}`, esc(p.objeto), badgeSit(p.situacao)) +
    `<section class="card"><dl class="dados" style="margin:0 0 18px"><div><dt>Amparo legal</dt><dd>${esc((AMPAROS[p.amparo] || {}).rot || '—')}</dd></div><div><dt>Categoria</dt><dd>${esc(CATEGORIAS[p.categoria])}</dd></div><div><dt>Natureza da despesa</dt><dd>${p.natureza} · ${esc(NATUREZAS[p.natureza])}</dd></div><div><dt>Valor estimado</dt><dd class="valor"><b>${reais(valorProcesso(p))}</b></dd></div></dl>${encerradoSem ? `<div class="aviso-lei">Processo encerrado como <b>${esc(SITUACOES[p.situacao][0].toLowerCase())}</b>.</div>` : stepper}</section>
    <div class="abas" role="tablist">${abas.map(([k, t]) => `<a href="#/processos/${p.id}/${k}" class="${aba === k ? 'on' : ''}" role="tab" aria-selected="${aba === k}">${t}</a>`).join('')}</div>${corpo}`;
}
function abaInstrucao(p) {
    const L = checklist(p);
    const feitos = L.filter(i => i.ok).length;
    const etRot = { instrucao: 'Instrução (planejamento)', juridico: 'Análise jurídica', autorizacao: 'Autorização' };
    const grupos = ['instrucao', 'juridico', 'autorizacao'].map(et => {
        const itens = L.filter(i => i.etapa === et); if (!itens.length) return '';
        return `<h3 class="sub-cap">${etRot[et]}</h3><div class="checklist">${itens.map(i => {
            const doc = p.docs[i.chave];
            const status = i.ok ? badge('Concluído', 'b-ok') : doc ? badge('Rascunho', 'b-warn') : badge('Pendente', 'b-mute');
            const acao = i.chave === 'pesquisa_precos' ? `<a class="btn btn-g btn-sm" href="#/processos/${p.id}/itens">Abrir</a>` : `<button class="btn ${i.ok ? 'btn-g' : 'btn-s'} btn-sm" data-acao="doc-abrir" data-p="${p.id}" data-tipo="${i.chave}">${i.ok ? 'Ver' : doc ? 'Continuar' : 'Preencher'}</button>`;
            return `<div class="check-item ${i.ok ? 'ok' : 'pendente'}"><span class="marca">${ico(i.ok ? 'ok' : 'relogio', 15)}</span><div style="flex:1;min-width:0"><b>${esc(i.rot)}</b><div class="base">${esc(i.base)}${i.detalhe ? ' · ' + esc(i.detalhe) : ''}${doc && doc.situacao === 'concluido' ? ` · v${doc.versao} · ${dataBR(doc.em)} · ${esc(nomeUsuario(doc.por))}` : ''}</div></div>${status}${acao}</div>`;
        }).join('')}</div>`;
    }).join('');
    return `<section class="card"><div class="row"><div><h2>Checklist da instrução</h2><p class="hint">${ehDireta(p.modalidade) ? 'Contratação direta: incisos I a VIII ' + lei('art. 72') : 'Fase preparatória ' + lei('art. 18') + ' e parecer ' + lei('art. 53')}</p></div><b class="valor">${feitos} de ${L.length}</b></div><div style="margin:12px 0 4px">${barra(feitos / L.length * 100, 'Progresso da instrução')}</div>${grupos}</section>`;
}
function abaItens(p) {
    const edita = pode('processos.gerenciar') && p.situacao === 'planejamento';
    const itens = p.itens.map(it => {
        const r = pesquisa(it);
        const linhas = it.cotacoes.map((c, i) => { const valida = r.validas.includes(i); return `<tr class="${valida ? '' : 'riscada'}"><td>${esc(FONTES[c.fonte].rot)} <span class="lei">art. 23, § 1º, ${FONTES[c.fonte].inc}</span><div class="small muted">${esc(c.origem)}</div></td><td>${dataBR(c.data)}</td><td class="num valor">${reais(c.valor)}</td><td>${valida ? badge('Válida', 'b-ok') : `<span class="b b-err">Descartada</span><div class="small muted" style="margin-top:4px;max-width:280px">${esc(r.descartadas[i])}</div>`}</td>${edita ? `<td class="acoes"><button class="btn btn-g btn-sm btn-icone" data-acao="cotacao-remover" data-p="${p.id}" data-it="${it.id}" data-i="${i}" aria-label="Remover cotação">${ico('lixeira', 16)}</button></td>` : ''}</tr>`; }).join('');
        return `<section class="card"><div class="row"><div><h2>${esc(it.descricao)}</h2><p class="hint">${num(it.qtd, 0)} ${esc(it.unidade)}</p></div><div class="btns">${edita ? `<label class="small muted" for="m-${it.id}">Método</label><select class="input input-sm" id="m-${it.id}" data-metodo data-p="${p.id}" data-it="${it.id}">${Object.entries({ mediana: 'Mediana', media: 'Média', menor: 'Menor preço' }).map(([k, v]) => `<option value="${k}" ${k === r.metodo ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn btn-s btn-sm" data-acao="cotacao-nova" data-p="${p.id}" data-it="${it.id}">${ico('mais', 16)}Cotação</button>` : ''}</div></div>
        <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Fonte</th><th>Data</th><th class="num">Valor unitário</th><th>Resultado</th>${edita ? '<th></th>' : ''}</tr></thead><tbody>${linhas || `<tr><td colspan="5">${vazio('Sem cotações', 'Inclua ao menos 3 preços.')}</td></tr>`}</tbody></table></div>
        <div class="resumo-preco"><div><span class="muted small">Valor unitário estimado (${{ mediana: 'mediana', media: 'média', menor: 'menor preço' }[r.metodo]})</span><b class="valor">${reais(r.valor)}</b></div><div><span class="muted small">Total do item</span><b class="valor">${reais(r.valor * it.qtd)}</b></div><div><span class="muted small">Preços válidos</span><b>${r.validas.length}</b></div><div><span class="muted small">Coeficiente de variação</span><b>${pct(r.cv)}</b></div></div>
        ${r.alertas.map(a => `<div class="flash flash-aviso" style="margin-top:12px">${ico('alerta')}<span>${esc(a)}</span></div>`).join('')}</section>`;
    }).join('');
    return `<div class="aviso-lei">Regras aplicadas: cotação de fornecedor vale 6 meses e contratação similar vale 1 ano; preços mais de 50% acima ou abaixo da mediana são descartados; mínimo de 3 preços ${lei('art. 23')}</div>` +
        (edita ? `<div class="btns"><button class="btn btn-p" data-acao="item-novo" data-p="${p.id}">${ico('mais', 16)}Novo item</button></div>` : '') + (itens || `<section class="card">${vazio('Nenhum item', 'Cadastre os itens para fazer a pesquisa de preços.')}</section>`);
}
function abaTramitacao(p) {
    const ds = destinos(p);
    const visiveis = ds.map(d => {
        const temPerm = pode(d.perm), b = bloqueiosTransicao(p, d.para);
        return `<div class="trans ${d.perigo ? 'perigo' : ''}"><div><b>${esc(d.rot)}</b><div class="small muted">Quem pode: ${esc(Object.entries(PERFIS).filter(([, v]) => v.perms.includes(d.perm)).map(([, v]) => v.rot).join(', '))}${d.just ? ' · exige justificativa' : ''}</div>${b.length && temPerm ? `<ul class="motivos">${b.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}</div><button class="btn ${d.perigo ? 'btn-d' : 'btn-p'} btn-sm" data-acao="transitar" data-p="${p.id}" data-para="${d.para}" ${!temPerm || b.length ? 'disabled' : ''} title="${!temPerm ? 'Seu perfil não pode fazer esta ação' : b.length ? 'Há pendências' : ''}">${temPerm ? (b.length ? 'Bloqueado' : 'Executar') : 'Sem permissão'}</button></div>`;
    }).join('');
    return `<section class="card"><h2>Tramitação</h2><p class="hint">Cada passo exige o perfil certo e confere as regras da lei antes de seguir. Troque de perfil no topo para ver as diferenças.</p><div class="list">${visiveis || vazio('Processo encerrado', 'Não há mais passos.')}</div></section>`;
}
const badgePncp = e => e.situacao === 'publicado' ? badge(e.operacao === 'inserir' ? 'Publicado' : 'Retificado', 'b-ok') : e.situacao === 'erro' ? badge(e.retentavel ? `Erro ${e.http} · vai tentar de novo` : `Erro ${e.http} · corrigir`, 'b-err') : badge('Na fila', 'b-info');

function telaDispensa() {
    const ano = Number(hoje().slice(0, 4));
    const f = S.simDisp || (S.simDisp = { ano, categoria: 'servico', natureza: '3.3.90.39', valor: 9000 });
    const a = avaliarDispensa(Number(f.ano), f.categoria, f.natureza, Number(f.valor));
    const anos = Object.fromEntries(Object.keys(S.limites).map(k => [k, k]));
    return cab('Limite de dispensa por valor', `Simulador com os valores do ano e a soma por natureza de despesa ${lei('art. 75, I e II, §§ 1º e 2º')}`) +
    `<div class="g2"><section class="card"><h2>Nova contratação</h2><form data-form="sim-dispensa" class="form-grid" style="margin-top:14px">
      ${campo('ano', 'Exercício', sel('ano', anos, f.ano, 'data-auto'))}
      ${campo('categoria', 'Categoria', sel('categoria', CATEGORIAS, f.categoria, 'data-auto'))}
      ${campo('natureza', 'Natureza da despesa', sel('natureza', Object.fromEntries(Object.entries(NATUREZAS).map(([k, v]) => [k, k + ' · ' + v])), f.natureza, 'data-auto'), '', 'full')}
      ${campo('valor', 'Valor da nova contratação (R$)', inp('valor', f.valor, 'type="number" min="0" step="0.01" data-auto'), '', 'full')}
      <div class="campo full"><label class="check"><input type="checkbox" name="dobro" data-auto ${S.orgao.dobro ? 'checked' : ''} ${pode('*') || usuario().perfil === 'administrador-geral' ? '' : 'disabled'}> Consórcio público ou agência executiva: limites em dobro ${lei('art. 75, § 2º')}</label></div>
    </form>
    <div class="aviso-lei" style="margin-top:14px"><b>Limites de ${f.ano}</b>: ${reais(S.limites[f.ano].eng)} (obras e serviços de engenharia) e ${reais(S.limites[f.ano].outros)} (demais). ${esc(S.limites[f.ano].base)} ${S.limites[f.ano].conferido ? badge('Conferido', 'b-ok') : badge('Conferir o decreto', 'b-warn')}</div></section>
    <section class="card resultado ${a.ok ? 'ok' : 'nao'}"><h2>${a.ok ? 'Cabe na dispensa' : 'Não cabe na dispensa'}</h2><p class="hint">Art. 75, ${a.lim.inciso} · soma do exercício na natureza ${esc(f.natureza)}</p>
      <div class="num-grande valor">${reais(a.total)}</div><div class="small muted">de ${reais(a.lim.valor)} ${S.orgao.dobro ? '(em dobro)' : ''}</div>

    `<div class="kpis">

      <div class="card kpi"><span class="lbl">Supressões</span><span class="val">${pct(pS)}</span><span class="foot">limite 25% ${lei('art. 125')}</span>${barra(pS / 25 * 100, 'Supressões')}</div>

      <div><dt>Processo</dt><dd>${c.processoId ? `<a href="#/processos/${c.processoId}">${esc(processo(c.processoId).numero)}</a>` : '—'}</dd></div>

      <div><dt>Natureza</dt><dd>${c.continuo ? 'Serviço contínuo' : 'Por escopo'}${c.reforma ? ' · reforma' : ''}</dd></div>

      <div><dt>Valor inicial atualizado</dt><dd class="valor">${reais(vIA)} <span class="small muted">(com apostilamentos)</span></dd></div>

        ['Verificação em duas etapas obrigatória para administradores', 'LGPD art. 46'], ['Perfis de acesso e segregação de funções', 'Lei 14.133 art. 7º, § 1º'], ['Trilha de auditoria imutável, encadeada por hash', 'LGPD art. 37'],
        ['Fonte e recursos hospedados no próprio sistema, sem chamadas a terceiros', 'LGPD art. 6º, VII'], ['Canal do titular com protocolo e prazo de 15 dias', 'LGPD arts. 18 e 19, II'], ['Registro das operações de tratamento (ROPA)', 'LGPD art. 37'],

/* ---------------- render ---------------- */
function render() {
    const r = rota();
    const app = $('#app');
    if (r[0] === 'lgpd-publico') { app.innerHTML = telaPublicoLgpd(); return; }
    if (r[0] === 'privacidade-publica') { app.innerHTML = telaPrivacidade(); return; }
    if (!usuario()) { app.innerHTML = telaLogin(); return; }
    const telas = {
        painel: [() => telaPainel(), 'painel.ver'], pca: [() => telaPca(r[1]), 'pca.ver'], demandas: [() => telaDemandas(), 'demandas.ver'],
        processos: [() => r[1] ? telaProcesso(r[1], r[2]) : telaProcessos(), 'processos.ver'], dispensa: [() => telaDispensa(), 'processos.ver'],
        contratos: [() => r[1] ? telaContrato(r[1]) : telaContratos(), 'contratos.ver'], fornecedores: [() => telaFornecedores(), 'fornecedores.ver'],
        pncp: [() => telaPncp(), 'pncp.enviar|auditoria.ver'], lgpd: [() => telaLgpd(r[1]), 'lgpd.gerenciar|auditoria.ver'], auditoria: [() => telaAuditoria(), 'auditoria.ver'],
    };
    const t = telas[r[0]] || telas.painel;
    const html = podeAlgum(t[1]) ? t[0]() : `<section class="card">${vazio('Acesso não permitido', 'Seu perfil não tem acesso a esta área. Troque de perfil no topo para testar.')}</section>`;
    const y = window.scrollY, mesma = render.ultima === location.hash;
    app.innerHTML = layout(html, telas[r[0]] ? r[0] : 'painel');
    if (mesma) { window.scrollTo(0, y); $('#conteudo').classList.remove('entrar'); } else window.scrollTo(0, 0);
    render.ultima = location.hash;
}
function atualizar() { salvar(); render(); }

/* ---------------- ações ---------------- */
const ACOES = {
    'fechar-modal': fecharModal,
    entrar: d => { S.sessao = d.id; auditar('Entrada no sistema', 'Sessão', 'demonstração'); salvar(); ir('painel'); toast(`Você entrou como ${nomeUsuario(d.id)}.`); },
    sair: () => { auditar('Saída do sistema', 'Sessão'); S.sessao = null; salvar(); location.hash = '#/'; render(); },
    reiniciar: () => abrirModal('Reiniciar a demonstração?', `<p>Isso apaga o que você fez aqui e volta aos dados fictícios iniciais.</p><div class="form-acoes"><button class="btn btn-s" data-acao="fechar-modal">Cancelar</button><button class="btn btn-d" data-acao="reiniciar-ok">${ico('reiniciar', 16)}Reiniciar</button></div>`),
    'reiniciar-ok': () => { const s = S.sessao; S = semente(); S.sessao = s; fecharModal(); atualizar(); toast('Demonstração reiniciada.'); },

    'pca-item': d => {
        if (!pode('pca.gerenciar')) return naoPode();
        abrirModal(`Incluir item no PCA ${d.ano}`, `<form data-form="pca-item" data-ano="${d.ano}" class="form-grid">${campo('descricao', 'Descrição', inp('descricao', '', 'required'), '', 'full')}${campo('categoria', 'Categoria', sel('categoria', CATEGORIAS))}${campo('natureza', 'Natureza da despesa', sel('natureza', Object.fromEntries(Object.entries(NATUREZAS).map(([k, v]) => [k, k + ' · ' + v]))))}${campo('unidade', 'Unidade requisitante', sel('unidade', { SEMED: 'SEMED · Educação', SEMUS: 'SEMUS · Saúde', SEMAD: 'SEMAD · Administração', SEMOB: 'SEMOB · Obras' }))}${campo('trimestre', 'Trimestre desejado', sel('trimestre', { 1: '1º', 2: '2º', 3: '3º', 4: '4º' }))}${campo('valor', 'Valor estimado (R$)', inp('valor', '', 'type="number" min="0.01" step="0.01" required'), '', 'full')}<div class="full">${acoesForm('Incluir')}</div></form>`);
    },
    'pca-aprovar': d => {
        if (!pode('pca.aprovar')) return naoPode();
        const pl = S.pca.find(p => p.ano === Number(d.ano));
        if (!pl.itens.length) return toast('O plano precisa ter itens.', 'erro');
        pl.situacao = 'aprovado'; pl.aprovadoEm = hoje(); auditar('PCA aprovado', `PCA ${pl.ano}`, `${pl.itens.length} itens`);
        if (pode('pncp.enviar')) enfileirar('pca', String(pl.ano), 'inserir', `PCA ${pl.ano}`);

function podeEditarDoc(p, tipo) {
    if (tipo === 'parecer_juridico') return pode('processos.parecer') && p.situacao === 'analise_juridica';
    if (tipo === 'autorizacao') return pode('processos.autorizar') && p.situacao === 'aguardando_autorizacao';
    return pode('processos.gerenciar') && p.situacao === 'planejamento';
}
function abrirDoc(pid, tipo) {
    const p = processo(pid), def = DOCS[tipo], doc = p.docs[tipo] || { situacao: 'novo', versao: 1, campos: {} };
    const pode_ = podeEditarDoc(p, tipo), concl = doc.situacao === 'concluido';
    let aviso = '';
    if (!pode_ && !concl) aviso = tipo === 'parecer_juridico' ? 'Só o jurídico, com o processo em análise jurídica (art. 53).' : tipo === 'autorizacao' ? 'Só a autoridade competente, com o processo aguardando autorização.' : 'Só quem instrui o processo, na etapa de planejamento.';
    const campos = Object.entries(def.campos).map(([k, [rot, obr]]) => concl || !pode_ ? `<div class="campo full"><span class="rotulo">${esc(rot)}${obr ? ' *' : ''}</span><div class="leitura">${doc.campos[k] ? esc(doc.campos[k]) : '<span class="muted">—</span>'}</div></div>` : campo(k, esc(rot) + (obr ? ' <span class="obr">obrigatório</span>' : ''), txt(k, doc.campos[k] || '', obr ? 'data-obr' : ''), '', 'full')).join('');
    abrirModal(esc(def.rot), `<form data-form="doc" data-p="${pid}" data-tipo="${tipo}" class="form-grid"><div class="full row"><span class="lei">${esc(def.base)}</span><span class="small muted">versão ${doc.versao}${concl ? ' · concluída em ' + dataBR(doc.em) + ' por ' + esc(nomeUsuario(doc.por)) : ''}</span></div>
      ${tipo === 'etp' ? `<div class="full aviso-lei">Os incisos I, IV, VI, VIII e XIII são obrigatórios. Os demais podem ficar em branco se a ausência for justificada ${lei('art. 18, § 2º')}</div>` : ''}
      ${aviso ? `<div class="full flash flash-aviso">${ico('cadeado')}<span>${esc(aviso)}</span></div>` : ''}
      ${concl ? `<div class="full flash flash-ok">${ico('cadeado')}<span>Peça concluída e travada. Hash do conteúdo: <code class="hash">${doc.hash.slice(0, 24)}…</code>. Para corrigir, crie uma nova versão.</span></div>` : ''}
      ${campos}
      <div class="full form-acoes"><button type="button" class="btn btn-s" data-acao="fechar-modal">Fechar</button>${concl && pode_ ? `<button type="button" class="btn btn-s" data-acao="doc-nova-versao" data-p="${pid}" data-tipo="${tipo}">Criar nova versão</button>` : ''}${!concl && pode_ ? `<button type="submit" class="btn btn-s" name="acao" value="rascunho">Salvar rascunho</button><button type="submit" class="btn btn-p" name="acao" value="concluir">${ico('cadeado', 16)}Concluir peça</button>` : ''}</div></form>`, true);
}

    <div class="campo full"><label class="check"><input type="checkbox" name="continuo" ${p.categoria !== 'material' ? 'checked' : ''}> Serviço ou fornecimento contínuo (até 5 anos, prorrogável até 10) ${lei('arts. 106 e 107')}</label><label class="check"><input type="checkbox" name="garantiaJust"> Garantia acima de 5% justificada pela complexidade ${lei('art. 98')}</label><label class="check"><input type="checkbox" name="grandeVulto"> Obra ou serviço de engenharia de grande vulto ${lei('art. 99')}</label><label class="check"><input type="checkbox" name="reforma" ${p.categoria === 'obra' ? 'checked' : ''}> Reforma de edifício ou equipamento (acréscimo até 50%) ${lei('art. 125')}</label></div>
    <div class="full">${acoesForm('Registrar contrato')}</div></form>`, true);
}

/* ---------------- formulários ---------------- */
const FORMS = {
    'pca-item': (f, el) => {
        const v = Number(f.valor); if (!f.descricao.trim() || !(v > 0)) return erroForm(el, ['Preencha a descrição e um valor maior que zero.']);
        const pl = S.pca.find(p => p.ano === Number(el.dataset.ano));
        pl.itens.push({ id: uid(), descricao: f.descricao.trim(), natureza: f.natureza, categoria: f.categoria, unidade: f.unidade, valor: v, trimestre: Number(f.trimestre) });
        auditar('Item incluído no PCA', `PCA ${pl.ano}`, f.descricao); fecharModal(); atualizar(); toast('Item incluído.');
    },
    demanda: (f, el) => {
        const e = []; if (!f.objeto.trim()) e.push('Informe o objeto.'); if (!(Number(f.valor) > 0)) e.push('Informe o valor estimado.'); if (!f.necessidade.trim()) e.push('Descreva a necessidade.');
        if (!f.itemPca && f.justificativa.trim().length < 20) e.push('Fora do PCA: justifique em pelo menos 20 caracteres (art. 12, § 1º).');
        if (e.length) return erroForm(el, e);
        const ano = Number(hoje().slice(0, 4));
        const d = { id: uid(), numero: `${String(S.demandas.length + 1).padStart(3, '0')}/${ano}`, unidade: f.unidade, solicitante: S.sessao, objeto: f.objeto.trim(), itemPca: f.itemPca || null, valor: Number(f.valor), necessidade: f.necessidade.trim(), justificativa: f.justificativa.trim(), data: hoje(), situacao: 'enviada' };
        S.demandas.push(d); auditar('Demanda registrada', `DFD ${d.numero}`, d.objeto); fecharModal(); atualizar(); toast(`DFD ${d.numero} registrado.`);
    },
    processo: (f, el) => {
        const e = [], mod = Number(f.modalidade), amp = Number(f.amparo);
        if (!f.objeto.trim()) e.push('Informe o objeto.');
        if (!AMPAROS[amp].mods.includes(mod)) e.push(`O amparo "${AMPAROS[amp].rot}" não serve para ${MODALIDADES[mod].toLowerCase()}.`);
        if (amp === 18 && !ehEngenharia(f.categoria)) e.push('Art. 75, I, é só para obras e serviços de engenharia. Use o inciso II.');
        if (amp === 19 && ehEngenharia(f.categoria)) e.push('Obras e serviços de engenharia usam o art. 75, I.');
        if ([6, 7].includes(mod) && ehEngenharia(f.categoria) && f.categoria === 'obra') e.push('Pregão não se aplica a obras (art. 29, parágrafo único).');
        if (e.length) return erroForm(el, e);
        const ano = Number(hoje().slice(0, 4));
        const dem = el.dataset.demanda ? S.demandas.find(x => x.id === el.dataset.demanda) : null;
        const seq = String(S.processos.filter(p => p.ano === ano).length + 13).padStart(3, '0');
        const p = { id: uid(), numero: `${seq}/${ano}`, ano, objeto: f.objeto.trim(), modalidade: mod, amparo: amp, criterio: Number(f.criterio), categoria: f.categoria, natureza: f.natureza, demandaId: dem ? dem.id : null, situacao: 'planejamento', criado: hoje(), docs: {}, itens: [], eventos: [{ em: hoje(), por: S.sessao, de: null, para: 'planejamento', obs: dem ? `Aberto a partir do DFD ${dem.numero}.` : '' }] };
        if (dem) {
            dem.situacao = 'em_processo'; dem.processoId = p.id;
            const campos = { necessidade: dem.necessidade, quantidade_justificada: 'Conforme o DFD.', previsao_pca: dem.itemPca ? 'Item do PCA vinculado.' : dem.justificativa, responsavel: nomeUsuario(dem.solicitante) };
            p.docs.dfd = { situacao: 'concluido', versao: 1, campos, em: hoje(), por: dem.solicitante, hash: sha256(JSON.stringify(campos)) };
        }
        S.processos.unshift(p); auditar('Processo aberto', `${MODALIDADES[mod]} ${p.numero}`, p.objeto);
        fecharModal(); salvar(); ir(`processos/${p.id}`); toast('Processo aberto. Siga o checklist da instrução.');
    },
    doc: (f, el, sub) => {
        const p = processo(el.dataset.p), tipo = el.dataset.tipo, def = DOCS[tipo];
        if (!podeEditarDoc(p, tipo)) return naoPode();
        const campos = {}; Object.keys(def.campos).forEach(k => campos[k] = (f[k] || '').trim());
        const atual = p.docs[tipo] || { versao: 1 };
        const concluir = sub === 'concluir';
        if (concluir) {
            const falta = Object.entries(def.campos).filter(([k, [, obr]]) => obr && !campos[k]).map(([, [rot]]) => `Preencha: ${rot}`);
            if (tipo === 'parecer_juridico' && campos.conclusao && !/^(favor[aá]vel|desfavor[aá]vel)/i.test(campos.conclusao)) falta.push('A conclusão precisa começar por "favorável", "favorável com ressalvas" ou "desfavorável".');
            if (falta.length) return erroForm(el, falta);
        }
        p.docs[tipo] = { situacao: concluir ? 'concluido' : 'rascunho', versao: atual.versao || 1, campos, em: hoje(), por: S.sessao, hash: concluir ? sha256(JSON.stringify(campos)) : null };
        auditar(concluir ? 'Peça concluída' : 'Peça salva (rascunho)', `${def.rot} · ${p.numero}`, concluir ? 'hash ' + p.docs[tipo].hash.slice(0, 12) : '');
        fecharModal(); atualizar(); toast(concluir ? 'Peça concluída e travada.' : 'Rascunho salvo.');
    },
    item: (f, el) => {
        if (!f.descricao.trim() || !(Number(f.qtd) > 0)) return erroForm(el, ['Preencha a descrição e a quantidade.']);
        const p = processo(el.dataset.p); p.itens.push({ id: uid(), descricao: f.descricao.trim(), qtd: Number(f.qtd), unidade: f.unidade.trim() || 'unidade', metodo: 'mediana', cotacoes: [] });
        auditar('Item incluído', p.numero, f.descricao); fecharModal(); atualizar();
    },
    cotacao: (f, el) => {
        const e = []; if (!f.origem.trim()) e.push('Informe a origem do preço.'); if (!(Number(f.valor) > 0)) e.push('Informe o valor.'); if (!f.data) e.push('Informe a data.');
        if (e.length) return erroForm(el, e);
        const it = processo(el.dataset.p).itens.find(i => i.id === el.dataset.it);
        it.cotacoes.push({ id: uid(), fonte: f.fonte, origem: f.origem.trim(), data: f.data, valor: Number(f.valor) });
        auditar('Cotação incluída', it.descricao, `${FONTES[f.fonte].rot} · ${reais(f.valor)}`); fecharModal(); atualizar();
        const r = pesquisa(it), i = it.cotacoes.length - 1;
        toast(r.validas.includes(i) ? 'Cotação válida incluída.' : 'Cotação incluída, mas descartada: ' + r.descartadas[i], r.validas.includes(i) ? 'ok' : 'erro');
    },
    transitar: (f, el) => {
        const p = processo(el.dataset.p), para = el.dataset.para, dest = destinos(p).find(x => x.para === para);
        if (!dest || !pode(dest.perm)) return naoPode();
        if (dest.just && (f.justificativa || '').trim().length < 20) return erroForm(el, ['A justificativa precisa ter pelo menos 20 caracteres (art. 71).']);
        const b = bloqueiosTransicao(p, para); if (b.length) return erroForm(el, b);
        const de = p.situacao; p.situacao = para;
        p.eventos.push({ em: hoje(), por: S.sessao, de, para, obs: (f.justificativa || '').trim() });
        auditar('Processo tramitado', `${MODALIDADES[p.modalidade]} ${p.numero}`, `${SITUACOES[de][0]} → ${SITUACOES[para][0]}`);
        if (para === 'publicado') enfileirar('compra', p.id, p.pncp ? 'retificar' : 'inserir', `${MODALIDADES[p.modalidade]} ${p.numero}`);
        if (['homologado', 'revogado', 'anulado', 'deserto', 'fracassado'].includes(para) && p.pncp) enfileirar('compra', p.id, 'retificar', `${MODALIDADES[p.modalidade]} ${p.numero} · ${SITUACOES[para][0].toLowerCase()}`);
        fecharModal(); atualizar(); toast(`Processo agora em: ${SITUACOES[para][0]}.`);
    },
    contrato: (f, el) => {
        const p = processo(el.dataset.p), e = [];
        const fo = fornecedor(f.fornecedorId);
        if (impedido(fo)) e.push(`${fo.nome} está impedido de contratar (art. 156, III e IV). Escolha outro fornecedor.`);
        if (f.gestor === f.fiscal) e.push('Gestor e fiscal precisam ser pessoas diferentes (art. 7º, § 1º, segregação de funções).');
        if (!(Number(f.valorInicial) > 0)) e.push('Informe o valor inicial.');
        if (!f.inicio || !f.fim || f.fim <= f.inicio) e.push('O fim da vigência precisa ser depois do início.');
        else if (f.continuo && mesesEntre(f.inicio, f.fim) > 60) e.push('Contrato contínuo: vigência inicial de no máximo 5 anos (art. 106).');
        if (S.contratos.some(c => c.numero === f.numero.trim())) e.push('Já existe contrato com esse número.');
        e.push(...avaliarGarantia(Number(f.garantiaPct), !!f.garantiaJust, !!f.grandeVulto));
        if (e.length) return erroForm(el, e);
        const c = { id: uid(), numero: f.numero.trim(), processoId: p.id, fornecedorId: f.fornecedorId, objeto: p.objeto, valorInicial: Number(f.valorInicial), inicio: f.inicio, fim: f.fim, continuo: !!f.continuo, reforma: !!f.reforma, gestor: f.gestor, fiscal: f.fiscal, garantiaPct: Number(f.garantiaPct) || 0, termos: [] };
        S.contratos.unshift(c);
        const de = p.situacao; p.situacao = 'contratado'; p.fornecedorId = f.fornecedorId;
        p.eventos.push({ em: hoje(), por: S.sessao, de, para: 'contratado', obs: `Contrato ${c.numero}.` });
        auditar('Contrato registrado', `Contrato ${c.numero}`, reais(c.valorInicial));
        enfileirar('contrato', c.id, 'inserir', `Contrato ${c.numero}`);
        fecharModal(); salvar(); ir(`contratos/${c.id}`); toast('Contrato registrado e enfileirado para o PNCP.');
    },
    termo: (f, el) => {
        const c = contrato(el.dataset.c), valor = Number(f.valor) || 0;
        const e = avaliarTermo(c, f.tipo, valor, f.novoFim);
        if (!f.descricao.trim()) e.push('Escreva a justificativa.');
        if (e.length) return erroForm(el, e);
        const ordem = c.termos.filter(t => (t.tipo === 'apostilamento') === (f.tipo === 'apostilamento')).length + 1;
        const t = { id: uid(), numero: f.tipo === 'apostilamento' ? `${ordem}º apostilamento` : `${ordem}º termo aditivo`, tipo: f.tipo, valor: f.tipo === 'aditivo_prazo' ? 0 : valor, novoFim: f.tipo === 'aditivo_prazo' ? f.novoFim : null, data: hoje(), descricao: f.descricao.trim() };
        c.termos.push(t); auditar('Termo de contrato registrado', `Contrato ${c.numero}`, `${TIPOS_TERMO[f.tipo]}${t.valor ? ' · ' + reais(t.valor) : ''}`);
        if (f.tipo !== 'apostilamento') { S.pncp.unshift({ id: uid(), tipo: 'termo', ref: c.id, termoId: t.id, operacao: 'inserir', rotulo: `${t.numero} do contrato ${c.numero}`, situacao: 'pendente', tentativas: 0, criado: new Date().toISOString(), log: [] }); }
        fecharModal(); atualizar(); toast(`${t.numero} registrado.`);
    },
    fornecedor: (f, el) => {
        const e = [], doc = soDigitos(f.documento);
        if (f.tipo === 'pj' && !cnpjValido(doc)) e.push('CNPJ inválido: confira os dígitos verificadores.');
        if (f.tipo === 'pf' && !cpfValido(doc)) e.push('CPF inválido: confira os dígitos verificadores.');
        if (!f.nome.trim()) e.push('Informe o nome.');
        if (f.tipo === 'pj' && S.fornecedores.some(x => x.tipo === 'pj' && soDigitos(x.documento) === doc)) e.push('CNPJ já cadastrado.');
        if (f.tipo === 'pf' && S.fornecedores.some(x => x.tipo === 'pf' && x.documentoHash === hmac(doc))) e.push('CPF já cadastrado (encontrado pelo hash, sem decifrar).');
        if (e.length) return erroForm(el, e);
        const novo = { id: uid(), nome: f.nome.trim(), tipo: f.tipo, porte: f.porte, municipio: f.municipio.trim(), sancoes: [] };
        if (f.tipo === 'pj') novo.documento = formatarCnpj(doc); else Object.assign(novo, { documentoCifrado: cifrar(doc), documentoHash: hmac(doc), documentoMascarado: mascararCpf(doc) });
        S.fornecedores.push(novo); auditar('Fornecedor cadastrado', novo.nome, f.tipo === 'pf' ? 'CPF cifrado (não registrado na auditoria)' : novo.documento);
        fecharModal(); atualizar(); toast('Fornecedor cadastrado.');
    },
    sancao: (f, el) => {
        const t = TIPOS_SANCAO[f.tipo], m = Number(f.meses) || 0, e = [];
        if (t.impede && (m < t.min || m > t.max)) e.push(`${t.rot}: duração de ${t.min} a ${t.max} meses (${t.base}).`);
        if (!f.processo.trim() || !f.motivo.trim()) e.push('Informe o processo e a infração.');
        if (e.length) return erroForm(el, e);
        const fo = fornecedor(el.dataset.f);
        fo.sancoes.push({ id: uid(), tipo: f.tipo, inicio: f.inicio, fim: t.impede ? somaMeses(m, f.inicio) : f.inicio, processo: f.processo.trim(), motivo: f.motivo.trim() });
        auditar('Sanção registrada', fo.nome, `${t.rot} (${t.base})`); fecharModal(); atualizar(); toast(t.impede ? 'Sanção registrada. O fornecedor fica bloqueado para novos contratos.' : 'Sanção registrada.');
    },
    'sim-dispensa': () => {},
    'lgpd-resposta': (f, el) => {
        if ((f.resposta || '').trim().length < 20) return erroForm(el, ['Escreva uma resposta completa (mínimo 20 caracteres).']);
        const s = S.lgpd.solicitacoes.find(x => x.id === el.dataset.id); s.situacao = 'respondida'; s.resposta = f.resposta.trim(); s.respondidaEm = hoje();
        auditar('LGPD: pedido respondido', s.protocolo, diasEntre(s.data, hoje()) + ' dias após o pedido'); fecharModal(); atualizar(); toast('Resposta registrada.');
    },
    'lgpd-publico': (f, el) => {
        if (f.site) { toast('Pedido recebido.'); return; } // armadilha para robôs: finge sucesso e descarta
        const agora = Date.now(); S.tentativasLgpd = (S.tentativasLgpd || []).filter(t => agora - t < 600000);
        if (S.tentativasLgpd.length >= 5) return erroForm(el, ['Muitos pedidos em pouco tempo. Tente de novo em alguns minutos.']);
        const e = []; if (!f.nome.trim()) e.push('Informe seu nome.'); if (!cpfValido(f.cpf)) e.push('CPF inválido.'); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.push('E-mail inválido.'); if (f.descricao.trim().length < 10) e.push('Detalhe o pedido.');
        if (e.length) return erroForm(el, e);
        S.tentativasLgpd.push(agora);
        const ano = new Date().getFullYear(), al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const protocolo = `LGPD-${ano}-` + Array.from({ length: 8 }, () => al[Math.floor(Math.random() * al.length)]).join('');
        S.lgpd.solicitacoes.unshift({ id: uid(), protocolo, nome: f.nome.trim(), email: f.email.trim(), cpfMascarado: mascararCpf(f.cpf), cpfCifrado: cifrar(f.cpf), tipo: f.tipo, descricao: f.descricao.trim(), data: hoje(), prazo: somaDias(15), situacao: 'aberta' });
        const s = S.sessao; S.sessao = null; auditar('LGPD: solicitação recebida pelo canal público', protocolo, f.tipo); S.sessao = s; salvar();
        el.closest('section').innerHTML = `<div class="sucesso-pub">${ico('ok', 28)}<h2>Pedido recebido</h2><p>Seu protocolo é <b class="protocolo">${protocolo}</b>.</p><p class="muted">Responderemos em até 15 dias, até ${dataBR(somaDias(15))}, no e-mail informado.</p><a class="btn btn-p" href="#/painel">Voltar</a></div>`;
    },
};

/* ---------------- eventos ---------------- */
document.addEventListener('click', e => {
    const linha = e.target.closest('tr.linha-link');
    if (linha && !e.target.closest('a,button')) { location.hash = linha.dataset.href; return; }
    const b = e.target.closest('[data-acao]'); if (!b || b.disabled) return;
    const fn = ACOES[b.dataset.acao]; if (!fn) return;
    e.preventDefault(); fn(b.dataset, b);
});
document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const dados = {}; new FormData(f).forEach((v, k) => dados[k] = v);
    f.querySelectorAll('input[type=checkbox]').forEach(c => { if (!c.checked) delete dados[c.name]; });
    FORMS[f.dataset.form](dados, f, e.submitter ? e.submitter.value : null);
});
document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-troca]')) { S.sessao = t.value; auditar('Troca de usuário (demonstração)', nomeUsuario(t.value)); atualizar(); toast(`Agora você é ${nomeUsuario(t.value)} · ${PERFIS[usuario().perfil].rot}.`); return; }
    if (t.matches('[data-metodo]')) { const it = processo(t.dataset.p).itens.find(i => i.id === t.dataset.it); it.metodo = t.value; auditar('Método da pesquisa alterado', it.descricao, t.value); atualizar(); return; }
    if (t.matches('[data-auto]')) {
        const f = t.form; const d = new FormData(f);
        S.simDisp = { ano: d.get('ano'), categoria: d.get('categoria'), natureza: d.get('natureza'), valor: d.get('valor') };
        const dobro = f.querySelector('[name=dobro]'); if (!dobro.disabled) S.orgao.dobro = dobro.checked;
        atualizar();
        const foco = document.getElementById(t.id); if (foco) foco.focus();
    }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) fecharModal(); });
window.addEventListener('hashchange', () => { fecharModal(); render(); });

carregar();
render();
})();

</script>
